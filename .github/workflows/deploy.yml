name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Test
        run: npm run test
      - name: Build site for repository subpath
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$REPOSITORY_NAME" = "${{ github.repository_owner }}.github.io" ]; then
            export VITE_BASE="/"
          else
            export VITE_BASE="/${REPOSITORY_NAME}/"
          fi
          npm run build
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

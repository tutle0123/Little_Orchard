<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블루베리 · 밝고 통통한 새 그림체</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f9f6ee;color:#2f4228;font:16px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{background:white;border:1px solid #d5ddc7;border-radius:16px;padding:16px}.stage{height:320px;display:grid;place-items:center;background:#fff;border-radius:12px}.stage img{width:100%;height:100%;object-fit:contain}h2{font-size:18px}button{font:inherit;padding:10px;margin-bottom:18px}@media(max-width:650px){main{grid-template-columns:1fr}.stage{height:230px}}</style><h1>블루베리 새 그림체 · 검토용</h1><p>밝은 초록 · 통통한 파란 열매 · 매끈한 주황빛 줄기</p><button id="bg">잔디색 배경으로 보기</button><main><article><h2>수확 전</h2><div class="stage"><img src="blueberry-bush-ripe.png" alt="열매 있는 블루베리"></div></article><article><h2>수확 후</h2><div class="stage"><img src="blueberry-bush-empty.png" alt="열매 없는 블루베리"></div></article><article><h2>과일 아이콘</h2><div class="stage"><img src="blueberry-icon-single.png" alt="블루베리 아이콘"></div></article></main><p>게임에 적용하기 전의 일러스트 후보입니다. 픽셀 격자 원본이 아닙니다.</p><script>let green=false;document.querySelector('#bg').onclick=()=>{green=!green;document.querySelectorAll('.stage').forEach(el=>el.style.background=green?'#bedc93':'#fff');document.querySelector('#bg').textContent=green?'흰색 배경으로 보기':'잔디색 배경으로 보기';};</script></html>

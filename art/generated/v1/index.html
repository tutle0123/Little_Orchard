<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>과수원 생성 에셋 · 1차 검수</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:15px system-ui;color:#28352d;background:#f7f3e8}h1{font-size:24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}button{padding:10px 14px;font:inherit;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{background:#fffaf0;border:1px solid #c4c1ac;border-radius:12px;padding:14px}h2{margin:0 0 8px;font-size:18px}.stage{height:290px;background-color:var(--ground,#b6c9a0);background-image:linear-gradient(45deg,#ffffff25 25%,transparent 25%),linear-gradient(-45deg,#ffffff25 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff25 75%),linear-gradient(-45deg,transparent 75%,#ffffff25 75%);background-size:24px 24px;display:flex;align-items:end;justify-content:center;border-radius:8px}.plant{max-width:100%;height:100%;object-fit:contain}.icon{width:76px;height:76px;object-fit:contain;vertical-align:middle}.note{font-size:12px;min-height:36px;line-height:1.5}.hold{border:2px solid #bc704e}small{display:block;color:#785442}a{color:#2b644b}@media(max-width:650px){body{padding:12px}main{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:210px}}</style><h1>과수원 에셋 1차 비교</h1><p>GPT 생성 일러스트 초안 · 게임 적용 전 · 실제 알파 합성 확인 · 게임 적용 전</p><div class="toolbar"><button id="toggle">수확 후 보기</button><label>비교 배경 <select id="bg"><option value="#b6c9a0">잔디색</option><option value="#ffffff">흰색</option><option value="#32372e">어두운색</option></select></label><span id="state">열매 있음</span></div><main id="cards"></main><script>
const list=[['apple','사과'],['pear','배'],['mandarin','귤'],['peach','복숭아'],['blueberry','블루베리'],['persimmon','감']];let empty=false;
for(const [id,name]of list){const kind=id==='blueberry'?'bush':'tree';const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><div class="stage"><img class="plant" data-base="${id}-${kind}" src="${id}-${kind}-ripe.png" alt="${name} 식물"></div><div><img class="icon" src="${id}-icon.png" alt="${name} 아이콘"><a href="${id}-icon.png" download>아이콘 원본</a></div><p class="note">${id==='blueberry'?'원시 미리보기의 초록 RGB는 거의 투명. 흰색/잔디 합성 확인, 실제 게임 검수는 남음.':'시각 비교용 후보. 상태 전환 정렬과 게임 축소 품질은 추가 검수.'}</p>`;document.querySelector('#cards').append(article);}
document.querySelector('#toggle').onclick=()=>{empty=!empty;document.querySelectorAll('.plant').forEach(img=>img.src=img.dataset.base+(empty?'-empty.png':'-ripe.png'));document.querySelector('#state').textContent=empty?'수확 후':'열매 있음';document.querySelector('#toggle').textContent=empty?'열매 보기':'수확 후 보기';};document.querySelector('#bg').onchange=e=>document.documentElement.style.setProperty('--ground',e.target.value);
</script></html>
